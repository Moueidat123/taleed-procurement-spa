name: Validate procurement prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Type check, lint, domain tests and build
        run: npm run check
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance checks
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
# Deliberately no deployment. After the first successful local install,
# commit package-lock.json and replace the install conditional with npm ci.
